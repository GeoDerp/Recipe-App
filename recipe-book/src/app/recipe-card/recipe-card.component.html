<mat-card class="card" appearance="outlined">
  <div (click)="goToRecipePage()" style="display: flex; cursor: pointer">
    <mat-card-header>
      <mat-card-title>{{ recipe().title }}</mat-card-title>
    </mat-card-header>
    @if (recipe().imagestr) {
      <img
        style="margin-left: auto; order: 2"
        mat-card-md-image
        src="{{ recipe().imagestr }}"
        alt="{{ recipe().title }}"
      />
    }
  </div>
  <mat-card-content> </mat-card-content>

  <mat-card-actions>
    <button
      [class.favorited]="recipe().favorite"
      (click)="favoriteButton()"
      value="{{ recipe().favorite }}"
      mat-fab
    >
      <mat-icon>favorite</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
